name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: integration_test_password
          POSTGRES_DB: pr_forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d pr_forge_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: root
      DB_PASSWORD: integration_test_password
      DB_NAME: pr_forge_test
      JWT_SECRET: integration_test_secret
      FRONTEND_URL: http://localhost:3000
      API_URL: http://localhost:3001/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Validate migrations
        run: npm run db:migrate --workspace=pr-forge-backend
        env:
          NODE_ENV: test

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Build frontend
        run: npm run build
